name: Publish slides and notes (GitHub Pages)

# Publishes the slide PDFs committed under slides/, slides/index.html (the landing
# page) and the compiled lecture notes (notes.pdf) to GitHub Pages.
# Requires: Settings -> Pages -> Source = "GitHub Actions" (one-time, see README).

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - "notes/**"
      - "bibliography.bib"
      - ".github/workflows/build-slides.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile lecture notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: notes
          latexmk_use_lualatex: true
      - name: Stage site
        run: |
          mkdir -p _site
          cp slides/index.html slides/*.pdf _site/
          cp notes/main.pdf _site/notes.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
