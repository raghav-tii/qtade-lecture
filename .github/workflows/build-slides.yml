name: Publish slides (GitHub Pages)

# The slides are PDFs committed under slides/. This publishes them, together with
# slides/index.html (a landing page linking the four parts), to GitHub Pages.
# Requires: Settings -> Pages -> Source = "GitHub Actions" (one-time, see README).

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/build-slides.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deployment
        uses: actions/deploy-pages@v4
